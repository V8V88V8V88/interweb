name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  purge-cdn:
    # jsDelivr caches @main files for up to 12h; purge so ring changes show up right away.
    # Never blocks or fails the deploy.
    name: Purge jsDelivr cache
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Purge ring files
        run: |
          for repo in interweb vaibring; do
            for f in sites.json widget.css widget.js minimal.js; do
              url="https://purge.jsdelivr.net/gh/v8v88v8v88/${repo}@main/webring/${f}"
              echo "purge ${url}"
              curl -fsS --retry 3 --max-time 30 "${url}" > /dev/null || echo "::warning::purge failed for ${url}"
            done
          done
