name: Validate sites.json

on:
  pull_request:
    paths:
      - 'webring/sites.json'
      - 'scripts/validate.js'
      - 'scripts/check-site.js'

jobs:
  validate:
    name: Validate ring data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run validation
        run: node scripts/validate.js

      - name: Check new sites have working ring navigation
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth=1 origin "$BASE_SHA"
          git show "$BASE_SHA:webring/sites.json" > "$RUNNER_TEMP/base-sites.json"
          node scripts/check-site.js --new-since "$RUNNER_TEMP/base-sites.json"
